name: Check and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
            max-jobs = 1
      - name: Verify Linux source hashes
        run: |
          nix flake update parserCompiler haddockCompiler
          cat flake.lock
      - name: Restore component binary cache
        id: components
        uses: actions/cache/restore@v4
        with:
          path: .component-cache
          key: components-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'parser/**', 'haddock/aihc.lock', 'package.json', 'package-lock.json', 'scripts/transpile.mjs', 'scripts/transpile-haddock.mjs', 'shell/toolchain.json') }}
          restore-keys: components-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Import cached Nix outputs
        if: steps.components.outputs.cache-matched-key != ''
        run: nix copy --all --no-check-sigs --from "file://$PWD/.component-cache"
      - name: Restore and save compiler build dependencies
        if: steps.components.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Build components
        if: steps.components.outputs.cache-hit != 'true'
        run: |
          scripts/build-components.sh
          rm -rf .component-cache
          nix copy --to "file://$PWD/.component-cache" .#parser .#haddock .#parser-assets .#haddock-assets .#toolchain .#components
          readlink -f result-components > .component-cache/store-path
      - name: Use cached components
        if: steps.components.outputs.cache-hit == 'true'
        run: |
          cp -R --no-preserve=mode "$(cat .component-cache/store-path)/." .
      - name: Save component binary cache
        if: steps.components.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .component-cache
          key: ${{ steps.components.outputs.cache-primary-key }}
      - name: Check Nix inputs and cache import
        if: steps.components.outputs.cache-hit != 'true'
        run: |
          python3 scripts/check-nix-inputs.py
          nix copy --all --no-check-sigs --from "file://$PWD/.component-cache" --to "local?root=$RUNNER_TEMP/component-store"
          test -s "$RUNNER_TEMP/component-store$(cat .component-cache/store-path)/parser.wasm"
      - run: npm ci
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: nix develop --command ormolu --mode check parser/src/Main.hs
      - run: nix develop --command hlint parser/src
      - run: npx wrangler types
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            generated/
            parser.wasm
            public/
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hackage.aihc.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: worker-build
      - run: npm ci
      - run: npm run deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
