name: Check and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: compiler
        with:
          repository: ai-haskell-compiler/aihc
          ref: bf991343a626e758a7d6d616770824fb55aaac92
          path: .compiler
      - uses: actions/checkout@v4
        id: haddock-compiler
        with:
          repository: ai-haskell-compiler/aihc
          ref: 7b0c849328ad36de9135bcc215c706187d6beb0c
          path: .compiler-haddock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: cachix/install-nix-action@v31
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # The compiler commit also pins its flake inputs and Nix expressions.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.commit }}-${{ steps.haddock-compiler.outputs.commit }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            ~/.cache/aihc
            ~/.local/share/aihc
            .compiler/dist-newstyle
            .compiler-haddock/dist-newstyle
            .parser-build
            .haddock-build
            .planner-build
          key: parser-${{ runner.os }}-bf991343-7b0c849-${{ hashFiles('parser/aihc.lock', 'haddock/aihc.lock', 'planner/aihc.lock', 'package-lock.json') }}
      - run: npm ci
      - run: scripts/build-parser.sh
      - run: scripts/build-haddock.sh
      - run: scripts/build-planner.sh
      - run: npm run build
      - run: npm run check:planner
      - run: nix develop .compiler --command ormolu --mode check parser/src/Main.hs
      - run: nix develop .compiler --command hlint parser/src
      - run: npx wrangler types
      - run: npx wrangler types --config wrangler.docs.jsonc
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            generated/
            parser.wasm
            public/shell/haddock/
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hackage.aihc.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: worker-build
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
